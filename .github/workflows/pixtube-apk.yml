name: Build Pixtube APK

# Manual: Actions tab > "Build Pixtube APK" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No keystore is configured, so build.gradle.kts signs this APK with the debug key.
      - name: Build release APK
        run: ./gradlew :app:assembleGithubRelease --build-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pixtube-apk
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
